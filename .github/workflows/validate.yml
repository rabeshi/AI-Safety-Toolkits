name: Validate catalogue
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - run: python examples/01_offline_refusal_demo.py
      - run: python examples/05_judge_agreement.py
      - run: python -m pip install -r examples/requirements.txt
      - name: Run Inspect tutorials against the offline mock model
        run: |
          for task in 02_first_inspect_eval 04_refusal_eval 06_prompt_injection; do
            inspect eval examples/$task.py --model mockllm/model --log-dir /tmp/logs
          done
