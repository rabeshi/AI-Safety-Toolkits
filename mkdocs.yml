site_name: AI Safety Toolkit Hub
site_description: A beginner-friendly guide to AI safety evaluation methods, benchmarks, and tools, with papers, code, and hands-on tutorials.
site_url: https://rabeshi.github.io/AI-Safety-Toolkits/
repo_url: https://github.com/rabeshi/AI-Safety-Toolkits
repo_name: rabeshi/AI-Safety-Toolkits
edit_uri: edit/main/docs/
copyright: Hub text and code under the MIT licence. Linked projects keep their own licences.

validation:
  links:
    anchors: warn

theme:
  name: material
  icon:
    logo: material/shield-check-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/toolkit-filter.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Set up your computer: getting-started/setup.md
      - Learning paths: getting-started/learning-paths.md
      - Glossary: getting-started/glossary.md
  - Evaluation methods:
      - methods/index.md
      - Testing what a model says:
          - Question-and-answer benchmarks: methods/qa-benchmarks.md
          - Harmful requests and over-refusal: methods/harmful-requests.md
          - Bias and toxicity: methods/bias-toxicity.md
          - Factuality and hallucination: methods/factuality.md
          - Privacy: methods/privacy.md
          - Multimodal and embodied safety: methods/multimodal.md
      - Attacking the system:
          - Red teaming and jailbreaks: methods/red-teaming.md
          - Prompt injection: methods/prompt-injection.md
      - Testing what a model does:
          - Agent and tool-use safety: methods/agent-safety.md
          - Dangerous capabilities: methods/dangerous-capabilities.md
          - Alignment and propensity: methods/alignment-propensity.md
          - AI control evaluations: methods/ai-control.md
          - Interpretability-based evaluation: methods/interpretability.md
      - Measuring results:
          - "Scoring: rules, classifiers, judges, humans": methods/scoring.md
          - Holistic suites and regulation: methods/holistic.md
  - Tutorials:
      - tutorials/index.md
      - 1. Score an evaluation by hand: tutorials/01-offline-refusal.md
      - 2. Your first Inspect eval: tutorials/02-first-inspect-eval.md
      - 3. Run a real benchmark: tutorials/03-run-a-benchmark.md
      - 4. Build a refusal eval with a judge: tutorials/04-build-a-refusal-eval.md
      - 5. Check your judge: tutorials/05-judge-agreement.md
      - 6. Test an agent for prompt injection: tutorials/06-prompt-injection.md
  - Toolkits:
      - toolkits/index.md
      - Content safety: toolkits/content-safety.md
      - Refusal calibration: toolkits/refusal-calibration.md
      - Red teaming: toolkits/red-teaming.md
      - Prompt injection: toolkits/prompt-injection.md
      - Tool-using agents: toolkits/tool-using-agents.md
      - Web and GUI agents: toolkits/web-and-gui-agents.md
      - Specialized risk: toolkits/specialized-risk.md
      - Multimodal and embodied: toolkits/multimodal-and-embodied.md
      - Privacy: toolkits/privacy.md
      - Bias and toxicity: toolkits/bias-and-toxicity.md
      - Factuality and hallucination: toolkits/factuality-and-hallucination.md
      - Trustworthiness: toolkits/trustworthiness.md
      - Evaluation infrastructure: toolkits/evaluation-infrastructure.md
      - Alignment data: toolkits/alignment-data.md
      - Capability controls: toolkits/capability-controls.md
      - Governance and research: toolkits/governance-and-research.md
      - Directories: toolkits/directories.md
  - Guides:
      - Choosing a resource: guides/choosing.md
      - Designing a rigorous study: guides/methodology.md
      - Metrics and reporting: guides/metrics.md
      - Templates: guides/templates.md
  - About:
      - Scope and limitations: about/scope.md
      - Sources and data fields: about/sources.md
      - Original 25 resources: about/original-25.md
      - Validation record: about/validation.md
      - Roadmap: about/roadmap.md
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
